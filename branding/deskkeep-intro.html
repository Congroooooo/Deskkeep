<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Deskkeep intro</title>
<style>
  /* Runs once, about six seconds, then holds the logo. Used to record the MP4. */
  html, body { margin: 0; height: 100%; background: #17191d; overflow: hidden; }
  .stage { position: fixed; inset: 0; display: grid; place-items: center; }
  .lockup { display: flex; align-items: center; gap: 36px; }
  svg { width: 170px; height: 170px; overflow: visible; }

  .tile { opacity: 0; animation: fade 0.6s ease-out 0.1s forwards; }
  .d { transform-box: fill-box; transform-origin: left center; transform: scaleX(0);
       animation: draw-d 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.5s forwards; }
  .keyhole { transform-box: fill-box; transform-origin: center; transform: scale(0);
             animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 1.45s forwards; }
  .desk { transform-box: fill-box; transform-origin: center; transform: scaleX(0);
          animation: draw-desk 0.7s cubic-bezier(0.22, 1, 0.36, 1) 1.8s forwards; }

  /* Fixed width so the icon stays still while the name types out. */
  .text { display: grid; gap: 10px; width: 560px; }
  .word {
    margin: 0; font: 700 78px/1 Consolas, "Courier New", ui-monospace, monospace;
    color: #e9ebed; letter-spacing: -1px; white-space: nowrap; overflow: hidden;
    width: 0; animation: type 1.1s steps(8, end) 2.5s forwards;
  }
  .tagline {
    margin: 0; font: 400 20px/1.2 Consolas, "Courier New", ui-monospace, monospace;
    color: #9aa3ad; opacity: 0; animation: fade 0.8s ease-out 3.9s forwards;
  }
  .stage.exit { animation: out 0.5s ease-in 5.6s forwards; }

  @keyframes fade { to { opacity: 1; } }
  @keyframes draw-d { to { transform: scaleX(1); } }
  @keyframes pop { to { transform: scale(1); } }
  @keyframes draw-desk { to { transform: scaleX(1); } }
  @keyframes type { to { width: 8ch; } }
  @keyframes out { to { opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-delay: 0ms !important; }
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="lockup">
      <svg class="tile" viewBox="0 0 160 160" aria-hidden="true">
        <rect x="0" y="0" width="160" height="160" rx="36" fill="#17191d"/>
        <path class="d" d="M46 36 H84 A44 44 0 0 1 84 124 H46 Z" fill="#477d98"/>
        <g class="keyhole">
          <circle cx="82" cy="72" r="10" fill="#17191d"/>
          <rect x="78" y="78" width="8" height="22" rx="3" fill="#17191d"/>
        </g>
        <rect class="desk" x="26" y="132" width="108" height="6" rx="3" fill="#72a7bf"/>
      </svg>
      <div class="text">
        <p class="word">Deskkeep</p>
        <p class="tagline">Your private workspace, kept local.</p>
      </div>
    </div>
  </div>
  <script>
    // Hold the finished frame; the outro fades the stage at the end of the recording.
    setTimeout(() => document.getElementById("stage").classList.add("exit"), 0);
  </script>
</body>
</html>
